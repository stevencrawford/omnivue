name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  job-test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: internal/frontend/package.json

      - name: Generate frontend assets
        run: go generate ./internal/static/

      - name: Run oxlint
        if: runner.os == 'Linux'
        run: cd internal/frontend && pnpm install && pnpm run lint

      - name: Run oxfmt check
        if: runner.os == 'Linux'
        run: cd internal/frontend && pnpm run fmt:check

      # Install both tools from the Go module proxy instead of GitHub release
      # assets, which intermittently return 504 and fail CI before lint runs.
      - name: Install linters
        if: runner.os == 'Linux'
        run: |
          GOBIN="$RUNNER_TEMP/go-bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          GOBIN="$RUNNER_TEMP/go-bin" go install github.com/reviewdog/reviewdog/cmd/reviewdog@v0.21.3
          echo "$RUNNER_TEMP/go-bin" >> "$GITHUB_PATH"

      - name: Run lint
        if: runner.os == 'Linux'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          code=0
          out="$(golangci-lint run --output.text.path stdout)" || code=$?
          if [ "$code" -gt 2 ]; then
            printf '%s\n' "$out"
            exit "$code"
          fi
          printf '%s\n' "$out" | reviewdog \
            -f=golangci-lint \
            -name=golangci \
            -reporter=github-pr-check \
            -filter-mode=added \
            -fail-level=error \
            -fail-on-error=false \
            -level=error

      - name: Run gostyle
        if: runner.os == 'Linux'
        uses: k1LoW/gostyle-action@e1b847d37b3041c5fdb8b911bcf00b350779ca61 # v1.5.1
        with:
          config-file: .gostyle.yml

      - name: Run tests
        run: make test

      - name: Run octocov
        if: runner.os == 'Linux'
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
